# Local/CI infrastructure for Snowman - mirrors the tightly-coupled,
# multi-middleware topology typical of a traditional enterprise deployment:
# a relational database for persistence and a JMS broker for integration
# with "external" (simulated) systems.
#
# Usage:
#   docker compose up -d mysql activemq      # bring up dependencies only
#   mvn liquibase:update                     # apply migrations against mysql
#   mvn -Dliquibase.should.run=false package
#   docker compose up --build app            # build & run the application
version: "3.8"

services:
  mysql:
    image: mysql:5.7
    container_name: snowman-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: snowman
      MYSQL_USER: username
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - snowman-mysql-data:/var/lib/mysql

  activemq:
    image: rmohr/activemq:5.15.9
    container_name: snowman-activemq
    ports:
      - "61616:61616" # OpenWire (JMS)
      - "8161:8161"   # Web console

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: snowman-app
    depends_on:
      mysql:
        condition: service_healthy
      activemq:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      JAVA_OPTS: "-Xms256m -Xmx512m"

volumes:
  snowman-mysql-data:
